name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
      - feature-improvement

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/app || cd /root/app
            git pull
            npm install
            npm run build
            pm2 restart all
